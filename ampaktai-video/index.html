<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>แอมปักใต้ — สั่งอาหารผ่าน LINE</title>
<link rel="stylesheet" href="assets/fonts/prompt.css">
<style>
:root{
  --line:#06C755;--line-d:#04A846;--dg:#0F4D2E;--dg2:#1B6B3F;--cream:#FFF6E6;--cream2:#F7E9D0;
  --brown:#4A2E1D;--ink:#1F2A24;--kraft:#C99A62;--gold:#D8B46A;--chatbg:#A9C1DF;--sent:#8FE170;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0d1a12;overflow:hidden;width:100%;height:100%}
body{font-family:'Prompt','Noto Color Emoji',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:var(--cream);transform-origin:0 0}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;z-index:0}
.abs{position:absolute}
svg{display:block;overflow:visible}

/* ---------- step caption ---------- */
.step{position:absolute;left:40px;top:40px;display:flex;align-items:center;gap:18px;z-index:50;
  background:rgba(255,255,255,.96);border-radius:28px;padding:14px 30px 14px 14px;
  box-shadow:0 10px 30px rgba(15,77,46,.18);border:3px solid rgba(6,199,85,.25)}
.step .num{width:78px;height:78px;border-radius:50%;background:var(--line);color:#fff;font-weight:800;font-size:46px;
  display:flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.step .lbl{font-size:21px;font-weight:700;color:var(--line-d);letter-spacing:3px;line-height:1.1}
.step .ttl{font-size:38px;font-weight:700;color:var(--dg);line-height:1.25;white-space:nowrap}

/* ---------- phone ---------- */
.phone{position:absolute;background:#1b1f24;border-radius:64px;padding:14px;box-shadow:0 30px 70px rgba(0,0,0,.28),inset 0 0 0 3px #3a4048}
.phone .scr{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:#fff}
.sbar{position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 40px 0;font-weight:600;font-size:21px;z-index:5}
.sbar .ic{display:flex;gap:7px;align-items:center}
.notch{position:absolute;top:10px;left:50%;width:150px;height:34px;margin-left:-75px;background:#1b1f24;border-radius:20px;z-index:6}
.chathead{position:absolute;left:0;right:0;top:54px;height:84px;background:#2F3E55;color:#fff;display:flex;align-items:center;gap:16px;padding:0 26px;z-index:4}
.chathead .nm{font-size:27px;font-weight:600;flex:1}
.chatarea{position:absolute;left:0;right:0;top:138px;bottom:86px;background:var(--chatbg);overflow:hidden}
.chatlist{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:16px}
.inbar{position:absolute;left:0;right:0;bottom:0;height:86px;background:#fff;display:flex;align-items:center;gap:16px;padding:0 22px;border-top:1px solid #e3e7ec;z-index:4}
.inbar .fld{flex:1;height:54px;border-radius:27px;background:#F1F3F6;display:flex;align-items:center;padding:0 22px;font-size:24px;color:#2b3440;white-space:nowrap;overflow:hidden}
.inbar .ph{color:#9aa3ad}
.caret{display:inline-block;width:2px;height:28px;background:var(--line);margin-left:2px;vertical-align:middle}
.sendbtn{width:54px;height:54px;border-radius:50%;background:#dfe3e8;display:flex;align-items:center;justify-content:center}

.msg{overflow:hidden;padding:0 18px;flex:none}
.msg .in{padding-top:16px}
.row{display:flex;align-items:flex-end;gap:10px}
.row.s{justify-content:flex-end}
.row.r{align-items:flex-start}
.av{width:58px;height:58px;border-radius:50%;flex:none;overflow:hidden;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.rcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.rname{font-size:18px;color:#26344a;font-weight:500;padding-left:4px}
.bub{font-size:25px;line-height:1.45;padding:13px 20px;border-radius:26px;max-width:400px;box-shadow:0 2px 4px rgba(0,0,0,.08);white-space:nowrap}
.r .bub{background:#fff;border-top-left-radius:8px}
.s .bub{background:var(--sent);border-bottom-right-radius:8px}
.meta{font-size:15px;color:#2a3a52;line-height:1.25;text-align:right;padding-bottom:4px;flex:none}
.r .meta{text-align:left}
.sysmsg{margin:6px auto 0;background:rgba(40,60,90,.35);color:#fff;font-size:19px;border-radius:20px;padding:7px 20px;width:max-content}
.typing{display:flex;gap:9px;padding:20px 24px}
.typing i{width:13px;height:13px;border-radius:50%;background:#8b98a8;display:block}
.icn{display:inline-block;width:34px}

.cards{display:flex;gap:9px}
.card{width:144px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.14)}
.card img{width:144px;height:118px;object-fit:cover;display:block}
.card .cn{font-size:21px;font-weight:600;text-align:center;padding:8px 4px 0;color:#1f2a24}
.card .cp{font-size:21px;font-weight:700;text-align:center;color:var(--line-d);padding:0 0 10px}

.sum{width:404px;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.14);border-top-left-radius:8px}
.sum .hd{background:var(--line);color:#fff;font-size:26px;font-weight:700;padding:12px 22px;display:flex;align-items:center;gap:10px}
.sum .bd{padding:10px 22px 16px}
.sum .ln{display:flex;justify-content:space-between;font-size:23px;line-height:1.75}
.sum .ln b{font-weight:600}
.sum .hr{height:2px;background:#e6ebe6;margin:6px 0}
.sum .tot{font-size:27px;font-weight:700;color:var(--dg)}
.sum .tot span:last-child{color:var(--line-d)}
.sum .chk{font-size:23px;line-height:1.7;display:flex;align-items:center;gap:10px;color:#24402f;font-weight:500}
.ck{width:28px;height:28px;border-radius:7px;background:var(--line);color:#fff;font-size:20px;display:inline-flex;align-items:center;justify-content:center;font-weight:800}

.qr{position:absolute;right:22px;bottom:100px;z-index:6;background:#fff;border:3px solid var(--line);color:var(--line-d);font-weight:700;font-size:27px;border-radius:40px;padding:10px 28px;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.tap{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;background:rgba(255,255,255,.55);border:4px solid rgba(255,255,255,.95);box-shadow:0 0 0 3px rgba(6,199,85,.5);z-index:30;pointer-events:none;opacity:0}

/* ---------- OA profile ---------- */
.oa{position:absolute;inset:0;background:#fff}
.oa .cover{position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(160deg,#1B6B3F,#0F4D2E 60%,#2a1d12)}
.oa .lg{position:absolute;left:50%;top:205px;transform:translateX(-50%);width:190px;height:190px;border-radius:50%;background:#fff;padding:6px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.oa .nm{position:absolute;left:0;right:0;top:412px;text-align:center;font-size:36px;font-weight:700;color:#1f2a24}
.oa .id{position:absolute;left:0;right:0;top:466px;text-align:center;font-size:26px;color:#7a8794;display:flex;align-items:center;justify-content:center;gap:8px}
.oa .desc{position:absolute;left:0;right:0;top:514px;text-align:center;font-size:24px;color:#4a5662}
.oa .btn{position:absolute;left:50%;top:590px;width:330px;height:84px;margin-left:-165px;border-radius:42px;background:var(--line);color:#fff;font-size:32px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 8px 18px rgba(6,199,85,.35)}
.oa .btn2{background:#fff;color:var(--line-d);border:4px solid var(--line);box-shadow:none}
.oa .tabs{position:absolute;left:30px;right:30px;top:720px;display:flex;justify-content:space-around;color:#56616c;font-size:22px;text-align:center}
.oa .tabs div div{width:66px;height:66px;border-radius:20px;background:#EEF7F1;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:32px}

/* ---------- notification ---------- */
.noti{position:absolute;width:660px;background:rgba(255,255,255,.97);border-radius:30px;padding:20px 26px;box-shadow:0 18px 40px rgba(0,0,0,.25);display:flex;gap:18px;z-index:40}
.noti .hd{display:flex;justify-content:space-between;font-size:20px;color:#6a7480;margin-bottom:4px}
.noti .hd b{color:#1f2a24;font-weight:600}
.noti .tx{font-size:27px;line-height:1.45;color:#1f2a24;font-weight:500}

/* ---------- progress ---------- */
.prog{position:absolute;background:#fff;border-radius:30px;padding:24px 40px 18px;box-shadow:0 14px 34px rgba(0,0,0,.2);z-index:35}
.prog .track{position:relative;display:flex;justify-content:space-between;width:620px}
.prog .ln0,.prog .ln1{position:absolute;top:27px;height:8px;border-radius:4px;left:60px}
.prog .ln0{right:60px;background:#e1e6e2}
.prog .ln1{background:var(--line);width:0}
.prog .nd{position:relative;width:120px;text-align:center}
.prog .dot{width:62px;height:62px;border-radius:50%;margin:0 auto 8px;border:6px solid #d3dad5;background:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;font-weight:800;position:relative}
.prog .dot .core{position:absolute;inset:9px;border-radius:50%;background:var(--line);opacity:0}
.prog .dot .ok{position:relative;opacity:0}
.prog .lb{font-size:24px;font-weight:600;color:#8a958e;white-space:nowrap;margin-left:-30px;margin-right:-30px}

/* ---------- misc ---------- */
.pill{display:inline-block;background:var(--line);color:#fff;border-radius:60px;font-weight:700}
.label{position:absolute;background:#fff;border-radius:40px;padding:10px 26px;font-size:26px;font-weight:600;color:var(--dg);box-shadow:0 8px 20px rgba(0,0,0,.14);white-space:nowrap}
.ticket{position:absolute;width:360px;background:#fffdf7;padding:24px 28px 40px;box-shadow:0 14px 30px rgba(0,0,0,.25);font-size:24px;line-height:1.6;color:#2b2b2b;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 16px) no-repeat,radial-gradient(circle 10px at 12px 100%,#0000 98%,#000) bottom left/24px 17px repeat-x}
.ticket h4{font-size:30px;font-weight:700;color:var(--dg);border-bottom:3px dashed #c9c0ad;padding-bottom:8px;margin-bottom:8px}
.ticket .ln{display:flex;justify-content:space-between}
.stamp{position:absolute;border:6px solid var(--line);color:var(--line-d);background:rgba(255,255,255,.92);border-radius:24px;font-size:40px;font-weight:800;padding:10px 30px;white-space:nowrap}
.mapcard{position:absolute;width:620px;background:#fff;border-radius:34px;box-shadow:0 18px 40px rgba(0,0,0,.22);overflow:hidden}
.mapcard .mh{display:flex;align-items:center;gap:14px;padding:18px 26px;font-size:27px;font-weight:700;color:var(--dg)}
.mapcard .mf{display:flex;justify-content:space-between;align-items:center;padding:16px 26px;font-size:25px;color:#33443a;font-weight:500}
.cod{position:absolute;background:#fff;border-radius:36px;padding:22px 40px;box-shadow:0 18px 40px rgba(0,0,0,.22);text-align:center;border:5px solid var(--line)}
.cod .a{font-size:34px;font-weight:700;color:var(--dg);display:flex;align-items:center;gap:14px;justify-content:center}
.cod .b{font-size:64px;font-weight:800;color:var(--line-d);line-height:1.15}
.bill{position:absolute;width:150px;height:76px;border-radius:8px;background:linear-gradient(135deg,#e8d6b8,#d4b98d);border:3px solid #b89a6a;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#7a5a2e;box-shadow:0 6px 12px rgba(0,0,0,.2)}
.speech{position:absolute;background:#fff;border-radius:34px;padding:16px 30px;font-size:40px;font-weight:700;color:var(--dg);box-shadow:0 10px 26px rgba(0,0,0,.18);white-space:nowrap}
.speech:after{content:"";position:absolute;left:46px;bottom:-22px;border:14px solid transparent;border-top:16px solid #fff;border-left:18px solid #fff}
.linebtn{position:absolute;background:var(--line);color:#fff;border-radius:70px;font-size:46px;font-weight:700;padding:22px 56px 22px 34px;display:flex;align-items:center;gap:22px;box-shadow:0 14px 34px rgba(0,0,0,.3),inset 0 -6px 0 rgba(0,0,0,.12);white-space:nowrap}
</style>
</head>

<div id="stage"></div>
<script>
'use strict';
/* =====================================================================
   Helpers
   ===================================================================== */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,d)=>clamp((t-a)/d);
const lerp=(a,b,k)=>a+(b-a)*k;
const E={
  out:x=>1-Math.pow(1-x,3),
  in:x=>x*x*x,
  io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  back:x=>{const c1=1.9,c3=c1+1;return x<=0?0:1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
  lin:x=>x
};
const $=s=>document.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function tf(el,{x=0,y=0,s=1,sx,sy,r=0,o}={}){
  if(!el)return;
  const S=sx!=null||sy!=null?`scale(${sx??s},${sy??s})`:`scale(${s})`;
  el.style.transform=`translate(${x}px,${y}px) ${S} rotate(${r}deg)`;
  if(o!=null)el.style.opacity=o;
}
function show(el,on){if(el)el.style.display=on?'':'none'}
/* pop-in factor: 0->1 with back overshoot, fade out at tOut */
function popK(t,tIn,dIn=.45,tOut=1e9,dOut=.3){
  return {s:E.back(P(t,tIn,dIn)),o:Math.min(E.out(P(t,tIn,dIn*.6)),1-E.out(P(t,tOut,dOut)))};
}
const seg=new Intl.Segmenter('th',{granularity:'grapheme'});
const graphemes=s=>[...seg.segment(s)].map(x=>x.segment);

const SFX=[];   // {t, k}  (sound cue list, read by the renderer to build the audio track)
const cue=(t,k,v=1)=>SFX.push({t:+t.toFixed(3),k,v});

   Vector art
   ===================================================================== */

}

function svgChef(){

/* =====================================================================
   Chat engine — each item appears at its own time, height grows smoothly
   ===================================================================== */
class Chat{
  constructor(list,items){
    this.list=list;this.items=items;
    for(const it of items){
      if(it.typing)it.html=typingHTML;
      const el=document.createElement('div');el.className='msg';
      el.innerHTML=`<div class="in">${it.html}</div>`;
      list.appendChild(el);it.el=el;it.inner=el.firstElementChild;
      if(it.side==='s'){it.inner.style.transformOrigin='100% 100%'}else{it.inner.style.transformOrigin='0% 0%'}
    }
  }
  measure(){for(const it of this.items){it.el.style.display='';it.el.style.height='auto';it.h=it.el.offsetHeight;}}
  render(t){
    for(const it of this.items){
      let k,s;
      if(it.typing){
        k=Math.min(E.out(P(t,it.t,.25)),1-E.out(P(t,it.t1,.18)));s=.6+.4*E.back(P(t,it.t,.35));
        $$('i',it.el).forEach((d,i)=>{const ph=(t*7-i*.9);d.style.transform=`translateY(${-7*Math.max(0,Math.sin(ph))}px)`;d.style.background=Math.sin(ph)>0?'#5f6d7e':'#9aa6b4'});
      }else{
        k=E.out(P(t,it.t,.3));s=.55+.45*E.back(P(t,it.t,.42));
      }
      if(k<=0.001){it.el.style.display='none';continue}
      it.el.style.display='';it.el.style.height=(it.h*k)+'px';
      it.inner.style.opacity=clamp(k*1.4);it.inner.style.transform=`scale(${s})`;
      if(it.sub)it.sub(t,it.el);
    }
  }
}

  const eo=root.querySelectorAll('.eyeo'),eh=root.querySelectorAll('.eyeh'),ms=root.querySelectorAll('.msmile'),mo=root.querySelectorAll('.mopen');
  const b=blink(t,off);
  eo.forEach(e=>{e.style.transformBox='fill-box';e.style.transformOrigin='50% 50%';e.style.transform=`scaleY(${Math.max(.08,b)})`;e.setAttribute('opacity',happy>.5?0:1)});

  $$('.flame').forEach((e,i)=>{const f=.65+.35*Math.abs(Math.sin(t*9+i*1.7))+(cooking?toss*.6:0);tf(e,{sy:f*(cooking?1.25:.7),sx:1,o:t>34.2?1:.5})});
  $$('.steam').forEach((e,i)=>{const k=((t*.55+i*.083)%1);tf(e,{x:Math.sin(k*6+i)*20,y:-k*520,s:.5+k*1.5,o:Math.sin(k*Math.PI)*(cooking?.85:.4)})});
  face($('#chef'),t,{happy:toss>.6||t>38.2?1:0,off:.3});
  tf($('#chef'),{y:Math.sin(t*3)*3-toss*6});
  // packing
  const drop=(id,t0,dy)=>{const k=E.in(P(t,t0,.35));const vis=t>t0-.25&&t<t0+.35;const a=E.out(P(t,t0-.25,.2));tf($(id),{y:k*(dy+200)+(1-a)*-40,o:vis?a:0})};
  drop('#itBox',37.25,180);drop('#itBowl',37.45,180);drop('#itW1',37.65,160);drop('#itW2',37.85,160);
  const sq=[37.6,37.8,38.0,38.2].reduce((s,x)=>s+Math.max(0,Math.sin(Math.PI*P(t,x,.18))),0);
  const bg=E.back(P(t,36.9,.5));
  tf($('#bag'),{sx:1+.06*sq,sy:1-.06*sq,o:1});tf($('#bagWrap'),{s:.7+.3*bg+.05*E.back(P(t,38.2,.4))-.05*P(t,38.2,.4)});
  const st=E.back(P(t,38.25,.4));tf($('#stamp'),{s:2-st,r:-8,o:clamp(st)});
}
function renderS8(t){
  wipe($('#s8'),t,39.1,.6,1300,600);
  // rider departs at 40.2; scroll distance
  const tt=Math.max(0,t-40.2);const dist=tt<1.2?380*tt*tt:380*1.44+912*(tt-1.2); // accel then cruise
  tf($('#far'),{x:-dist*.15});tf($('#mid'),{x:-dist*.6});
  $('#dash').style.transform=`translateX(${-(dist%180)}px)`;
  const rx=lerp(0,140,E.io(P(t,40.2,1.6)));
  const bob=t>40.2?Math.sin(t*22)*2:0;
  tf($('#rider8'),{x:rx,y:bob,r:t>40.2?-1.5*clamp(tt*2):0,o:1});
  $$('#rider8 .spin').forEach(w=>w.setAttribute('transform',`rotate(${dist*1.5})`));
  $('#speed').style.opacity=clamp((tt-.6)*1.5)*.9;
  $('#speed').style.transform=`translateX(${-(dist*1.4%300)}px)`;
  face($('#rider8'),t,{});
  // bag flies from shop door into box
  const fb=P(t,39.5,.55);const fbv=t>39.45&&t<40.08;
  const bx=lerp(300,640,E.io(fb)),by=lerp(640,600,fb)-Math.sin(Math.PI*fb)*160;
  const fbe=$('#flybag');fbe.style.opacity=fbv?1:0;fbe.style.transform=`translate(${bx-300}px,${by-640}px) scale(${1-.4*fb}) rotate(${fb*30}deg)`;
  const lid=Math.sin(Math.PI*P(t,40.0,.25));tf($('#rider8 .box'),{y:-lid*8});
  // map
  const mk=E.out(P(t,40.9,.6));tf($('#map'),{x:(1-mk)*700,o:mk});
  const lk=E.out(P(t,41.4,.4));$('#mlA').style.opacity=lk;$('#mlB').style.opacity=lk;
  tf($('#mlA'),{x:(1-mk)*700});tf($('#mlB'),{x:(1-mk)*700});
  const route=$('#route');const L=route.getTotalLength();const rk=E.io(P(t,41.4,3.4));
  route.style.strokeDasharray=L;route.style.strokeDashoffset=L*(1-rk);
  const pt=route.getPointAtLength(L*rk);$('#map .mover').setAttribute('transform',`translate(${pt.x} ${pt.y})`);
  const pb=Math.sin(t*5)*.06+1;$('#map .pinB').setAttribute('transform',`translate(460 300) scale(${pb})`);
}
function renderS9(t){
  wipe($('#s9'),t,45.1,.6,960,540);
  const ar=E.out(P(t,45.15,1.05));
  const dist=ar*900;
  tf($('#rider9'),{x:lerp(-900,0,ar),y:ar<1?Math.sin(t*22)*2:0,o:1});
  $$('#rider9 .spin').forEach(w=>w.setAttribute('transform',`rotate(${dist*1.5})`));
  face($('#rider9'),t,{happy:t>47.6?1:0});
  const cin=E.out(P(t,45.6,.6));tf($('#cust9'),{y:(1-cin)*60+Math.sin(t*2)*3,o:cin});
  face($('#cust9'),t,{happy:t>46.9?1:0});
  // bag handover (rider box -> customer)
  const bk=E.io(P(t,46.25,.8));const bv=t>46.15;
  const bx=lerp(390,1370,bk),by=lerp(560,700,bk)-Math.sin(Math.PI*bk)*120;
  tf($('#bag9'),{x:bx-700,y:by-600,s:lerp(.7,1,bk),o:bv?clamp(P(t,46.15,.15)):0});
  // cash customer -> rider
  ['#bill1','#bill2','#bill3','#bill4'].forEach((id,i)=>{
    const k=E.io(P(t,47.25+i*.12,.65));const v=t>47.15+i*.12&&t<48.4+i*.1;
    tf($(id),{x:lerp(0,-430,k)+i*8,y:-Math.sin(Math.PI*k)*120-i*6,r:lerp(-10,8,k)+i*4,o:v?clamp(P(t,47.15+i*.12,.15))*(1-P(t,48.15+i*.1,.25)):0});
  });
  const c=popK(t,47.65,.5);tf($('#cod'),{s:c.s,y:-10*Math.sin(t*2.5),o:c.o});
  const p=E.out(P(t,48.4,.45));tf($('#p9'),{y:(1-p)*-120,o:p});
  chat9.render(t);
}
function renderS10a(t){
  wipe($('#s10a'),t,50.5,.6,960,540);
  face($('#cust10'),t,{happy:t>51.0?1:0});
  tf($('#cust10'),{y:Math.sin(t*3)*5});
  const y=popK(t,51.05,.45);tf($('#yum'),{s:y.s,o:y.o});
  $$('.plate').forEach((e,i)=>{const k=E.back(P(t,50.6+i*.15,.5));tf(e,{y:(1-k)*120,o:clamp(k)})});
  $$('.steam10').forEach((e,i)=>{const k=((t*.5+i*.11)%1);tf(e,{y:-k*300,s:.5+k,o:Math.sin(k*Math.PI)*.7})});
  $$('.spark').forEach((e,i)=>{const k=(t*1.3+i*.37)%1;tf(e,{s:.5+Math.sin(k*Math.PI),o:t>51?Math.sin(k*Math.PI):0})});
}
function renderS10b(t){
  wipe($('#s10b'),t,52.3,.7,960,540);
  const l=popK(t,52.6,.6);tf($('#eLogo'),{s:l.s,r:(1-l.s)*-30,o:l.o});
  const a=E.out(P(t,52.85,.5));tf($('#eT1'),{y:(1-a)*50,o:a});
  const b=E.out(P(t,53.05,.5));tf($('#eT2'),{y:(1-b)*40,o:b});
  const c=E.out(P(t,53.25,.5));tf($('#eT3'),{y:(1-c)*40,o:c});
  const d=popK(t,53.55,.5);const pulse=t>54.2?1+.035*Math.sin((t-54.2)*7):1;const press=1-.06*Math.sin(Math.PI*P(t,54.15,.2));
  tf($('#eBtn'),{s:d.s*pulse*press,o:d.o});
  const tp=$('#eTap');const tk=P(t,54.15,.55);tp.style.opacity=tk>0&&tk<1?(1-tk):0;tp.style.transform=`scale(${.5+tk})`;
  const e=E.out(P(t,54.0,.5));tf($('#eT4'),{y:(1-e)*40,o:e});
}
/* step captions */
function renderSteps(t){
  for(const [n,,a,b] of STEPS){
    const el=$('#st'+n);const k=Math.min(E.out(P(t,a,.45)),1-E.in(P(t,b-.3,.3)));
    show(el,k>0.001);if(k<=0.001)continue;
    tf(el,{x:(1-k)*-80,o:k});
    el.querySelector('.num').style.transform=`scale(${.6+.4*E.back(P(t,a+.1,.45))})`;
  }
}
/* notification banner */
const NOTI=[
  [34.4,37.4,'ยืนยันออเดอร์เรียบร้อยค่ะ<br>กำลังจัดเตรียมอาหาร 👨‍🍳<br>ใช้เวลาประมาณ 30–40 นาทีค่ะ'],
  [40.7,44.9,'อาหารพร้อมจัดส่งแล้วค่ะ 🛵<br>พนักงานกำลังนำส่ง<br>อีกประมาณ 10–15 นาทีค่ะ'],
];
function renderNoti(t){
  const n=$('#noti');let on=false;
  for(const [a,b,tx] of NOTI){ if(t>=a&&t<b){on=true;$('#notiTx').innerHTML!==tx&&($('#notiTx').innerHTML=tx);
    const k=Math.min(E.back(P(t,a,.5)),1-E.in(P(t,b-.35,.35)));tf(n,{y:(1-k)*-260,o:clamp(k*1.5)});} }
  show(n,on);
}
/* progress tracker */
function renderProg(t){
  const pr=$('#prog');
  const on=t>34.55&&t<45.0;show(pr,on);if(!on)return;
  // position: kitchen bottom-center, delivery under map
  const inK=t<39.2;
  pr.style.left=(inK?560:1190)+'px';pr.style.top=(inK?905:830)+'px';
  const k=inK?E.out(P(t,34.6,.5))*(1-E.in(P(t,38.9,.3))):E.out(P(t,41.0,.5))*(1-E.in(P(t,44.7,.3)));
  tf(pr,{y:(1-k)*80,o:k});
  const st=[t>34.8?2:1, t>40.4?2:(t>35.0?1:0), t>40.6?1:0]; // 0 pending,1 active,2 done
  $('#pb1').textContent=t>40.4?'ทำอาหาร':'กำลังทำอาหาร';
  st.forEach((s,i)=>{
    const d=$('#pd'+i),core=d.querySelector('.core'),ok=d.querySelector('.ok'),lb=$('#pb'+i);
    d.style.borderColor=s?'#06C755':'#d3dad5';d.style.background=s===2?'#06C755':'#fff';
    core.style.opacity=s===1?1:0;core.style.transform=`scale(${s===1?.75+.25*Math.sin(t*6):1})`;
    ok.style.opacity=s===2?1:0;lb.style.color=s?'#0F4D2E':'#8a958e';
    d.style.boxShadow=s===1?`0 0 0 ${8+6*Math.sin(t*6)}px rgba(6,199,85,.18)`:'none';
  });
  const fill=t<40.5?(t>35.0?.5:0)*E.out(P(t,34.9,.4)):lerp(.5,1,E.out(P(t,40.45,.4)));
  $('#pl').style.width=(fill*500)+'px';
}

function render(t){
  t=clamp(t,0,DUR-1e-4);
  if(sceneVis('s1',t))renderS1(t);
  if(sceneVis('s2',t))renderS2(t);
  if(sceneVis('chat',t))renderChat(t);
  if(sceneVis('s7',t))renderS7(t);
  if(sceneVis('s8',t))renderS8(t);
  if(sceneVis('s9',t))renderS9(t);
  if(sceneVis('s10a',t))renderS10a(t);
  if(sceneVis('s10b',t))renderS10b(t);
  renderSteps(t);renderNoti(t);renderProg(t);
}

/* =====================================================================
   Boot: measure once fonts + images are ready
   ===================================================================== */
window.DURATION=DUR;window.SFX=SFX;
window.ready=(async()=>{
  await document.fonts.ready;
  await Promise.all([...document.images].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
  for(const id of Object.keys(S))show($('#'+id),true);
  chat.measure();s2chat.measure();chat9.measure();
  render(0);
  return true;
})();
window.seek=t=>render(t);

/* live preview when opened directly in a browser (?render disables it) */
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`}
if(!/render/.test(location.search)){
  addEventListener('resize',fit);fit();
  const q=location.search.match(/t=([\d.]+)/);
  window.ready.then(()=>{
    if(q){render(+q[1]);return}
    const t0=performance.now();
    const loop=()=>{render(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop)};loop();
  });
}
